# CFA-SHOC continuous integration. Runs on GitHub's servers; free for public repos,
# and private repos get a monthly free allowance. Nobody runs anything on their own device.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Until HANDOFF step 7 (packaging) lands, install dependencies directly and run from
      # the repo root so `import src.*` resolves. After step 7, replace this step with:
      #   python -m pip install -e ".[dev]"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "sqlalchemy>=2.0" "pytest>=7.0" "pytest-cov>=4.0" "pytest-timeout>=2.2"

      - name: Compile check
        run: python -m compileall -q src tests

      - name: Run tests
        run: python -m pytest -rA

  # Enable in HANDOFF step 12 once examples/demo_echo.py exists.
