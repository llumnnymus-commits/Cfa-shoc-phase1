# CFA-SHOC continuous integration. Runs on GitHub's servers; free for public repos,
# and private repos get a monthly free allowance. Nobody runs anything on their own device.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compile check
        run: python -m compileall -q src tests

      - name: Run tests
        run: python -m pytest -rA

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Install the wheel into a fresh venv and import it
        run: |
          python -m venv /tmp/fresh
          /tmp/fresh/bin/pip install dist/*.whl
          cd /tmp
          /tmp/fresh/bin/python -c "import cfa_shoc; print(cfa_shoc.__version__); assert cfa_shoc.__version__ == '0.1.0'"

      - name: Install the provenance extra and run the console script
        run: |
          WHEEL=$(ls dist/*.whl)
          /tmp/fresh/bin/pip install "${WHEEL}[provenance]"
          cd /tmp
          /tmp/fresh/bin/cfa-shoc --version

  demo:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[provenance]"
      - name: Run the demo (asserts every outcome; exits non-zero on any difference)
        run: python examples/demo_echo.py
