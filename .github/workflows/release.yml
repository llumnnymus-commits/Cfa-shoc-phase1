# Publishes cfa-shoc to PyPI with Trusted Publishing (no stored password or token).
# Runs ONLY when the owner publishes a GitHub Release. Nothing here runs on push.
# PyPI side (owner, once): add a pending publisher with owner llumnnymus-commits,
# repository Cfa-shoc-phase1, workflow release.yml, environment pypi.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check the tag matches the package version
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "${GITHUB_REF_NAME}" = "v${VERSION}" || { echo "Tag ${GITHUB_REF_NAME} != v${VERSION}"; exit 1; }
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  verify-from-pypi:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install the published package from PyPI and run the demo
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          python -m venv /tmp/pypi
          for attempt in 1 2 3 4 5 6; do
            /tmp/pypi/bin/pip install --no-cache-dir "cfa-shoc[provenance]==${VERSION}" && break
            echo "PyPI not ready yet (attempt ${attempt}); waiting"; sleep 30
          done
          cd /tmp
          /tmp/pypi/bin/python -c "import cfa_shoc; assert cfa_shoc.__version__ == '${VERSION}', cfa_shoc.__version__"
          /tmp/pypi/bin/python "${GITHUB_WORKSPACE}/examples/demo_echo.py"
