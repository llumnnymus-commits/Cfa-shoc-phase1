[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cfa-shoc"
version = "0.1.0"
description = "Capability-Factual, Stateful Hybrid Orchestration and Cognition - Phase 1"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    "pydantic>=2.0",
    "sqlalchemy>=2.0",
    "python-dateutil>=2.8",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "pytest-timeout>=2.2", "black>=23.0", "ruff>=0.1", "mypy>=1.0"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
target-version = "py311"
