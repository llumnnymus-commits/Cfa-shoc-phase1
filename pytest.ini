[pytest]
# CFA-SHOC Phase 1 Pytest Configuration

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers for test categorization
markers =
    unit: Unit tests for individual components
    integration: Integration tests for service coordination
    chaos: Chaos tests for error scenarios
    property: Property-based tests for invariant validation
    slow: Tests that take significant time
    requires_db: Tests that require database access

# Coverage configuration
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Timeout for individual tests (in seconds)
timeout = 30

# Minimum pytest version (Python >= 3.11 is set in pyproject.toml)
minversion = 7.0
